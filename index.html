<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1420" />
  <meta name="description" content="백석기계공업고등학교를 배경으로 한 2D 쯔꾸르식 탐색·탈출 게임" />
  <title>돌이킬 수 있을지도 모를 걸음</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="startScreen" class="start-screen">
    <main class="start-card">
      <h1>돌이킬 수 있을지도 모를 걸음</h1>
      <button id="startButton" class="primary-button start-button" type="button">START</button>
    </main>
  </div>

  <div id="gameShell" class="game-shell hidden">
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>BAEKSEOK</span><span class="topbar-divider">/</span><span id="stageCaption">STAGE 01</span></div>
      <div class="toolbar">
        <button type="button" id="inventoryButton" class="tool-button" title="소지품 보기">▣<span class="tool-caption"> 소지품</span><span id="itemCount" class="item-count">0</span></button>
        <button type="button" id="musicButton" class="tool-button" aria-label="음악 끄기">♫<span id="musicLabel" class="tool-caption"> 음악 켜짐</span></button>
      </div>
    </div>
    <div class="screen-frame">
      <div id="sceneName" class="scene-name">3학년 4반 · 교실</div>
      <canvas id="gameCanvas" width="1536" height="1024" tabindex="0" aria-label="방향키로 이동하고 사물을 클릭하는 학교 탐색 지도"></canvas>
      <div id="toast" role="status" class="toast hidden"></div>
      <div id="itemPickup" class="item-pickup hidden" role="status" aria-live="polite" aria-label="아이템 획득">
        <img id="pickupImage" src="assets/items/paper.webp" alt="" />
        <div class="pickup-label"><span>ITEM GET</span><strong id="pickupName"></strong></div>
      </div>
      <div id="fadeCover" class="fade-cover"></div>
    <div id="dialogueBox" class="dialogue-box hidden" aria-live="polite">
      <div class="dialogue-head"><span id="speaker" class="speaker">강무결</span><span id="dialogueCounter" class="dialogue-counter"></span></div>
      <div id="dialogueBody" class="dialogue-body"></div>
      <img id="dialogueIllustration" class="dialogue-illustration hidden" alt="대화 중 등장한 아이템 이미지" />
      <div id="choiceArea" class="choice-area hidden"></div>
      <div class="dialogue-actions"><button id="rosterPeek" type="button" class="text-button roster-peek hidden">▤ 출석부 보기</button><button id="skipButton" class="text-button" type="button">SKIP</button><button id="nextButton" class="next-button" type="button" title="다음 대사">▼ <span>다음</span></button></div>
    </div>
    </div>

    <footer class="bottom-strip"><span>BAEKSEOK · 3-4</span><span id="statusLine">강무결 · 교실</span></footer>
    <div class="mobile-pad" aria-label="모바일 이동 패드">
      <button type="button" data-dir="ArrowUp" aria-label="위로 이동">▲</button>
      <div><button type="button" data-dir="ArrowLeft" aria-label="왼쪽 이동">◀</button><button type="button" id="touchAction" aria-label="조사하기">●</button><button type="button" data-dir="ArrowRight" aria-label="오른쪽 이동">▶</button></div>
      <button type="button" data-dir="ArrowDown" aria-label="아래로 이동">▼</button>
    </div>
  </div>

  <div id="inventoryOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="소지품">
    <div class="modal inventory-modal"><div class="modal-header"><div><small>INVENTORY</small><h2>소지품</h2></div><button class="close-overlay" data-close="inventoryOverlay" aria-label="닫기">×</button></div><div id="inventoryGrid" class="inventory-grid"></div><p class="modal-footnote">조사 중 획득한 물품이 이곳에 보관됩니다.</p></div>
  </div>
  <div id="lockerOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="학생 사물함 목록">
    <div class="modal locker-modal"><div class="modal-header"><div><small>CLASS 3-4</small><h2>사물함 조사</h2><p>이름표를 선택해 사물함을 열어 보세요.</p></div><button class="close-overlay" data-close="lockerOverlay" aria-label="닫기">×</button></div><div id="lockerGrid" class="locker-grid"></div><div class="locker-footer"><button type="button" id="leaveLockersButton" class="leave-lockers-button">그만 살펴본다</button></div></div>
  </div>
  <div id="lockOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="교실 자물쇠">
    <div class="modal lock-modal"><div class="modal-header"><div><small>OBJECT · PADLOCK</small><h2>교실 문 자물쇠</h2></div><button class="close-overlay" data-close="lockOverlay" aria-label="닫기">×</button></div><img id="lockImage" alt="교실 문 자물쇠" src="assets/items/lock-default.webp" class="lock-art" /><p class="lock-explanation">자물쇠는 비밀번호로 열 수 있다.</p><form id="lockForm" autocomplete="off"><label for="lockPin">네 자리 비밀번호</label><input id="lockPin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required aria-label="네 자리 비밀번호" /><button class="primary-button small-primary" type="submit">확인 ▼</button></form><div class="lock-extra-actions"><button id="lockSkip" class="text-button" type="button">SKIP</button></div></div>
  </div>
  <div id="endingOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="엔딩">
    <div class="modal ending-modal"><p class="eyebrow">ANOTHER ENDING</p><h2 id="endingTitle"></h2><div class="ending-rule"></div><p id="endingDescription"></p><button id="replayButton" type="button" class="primary-button">REPLAY ↻</button></div>
  </div>
  <div id="rosterOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="3학년 4반 출석부">
    <div class="modal roster-modal"><div class="modal-header"><div><small>CLASS 3-4</small><h2>3학년 4반 출석부</h2></div><button class="close-overlay" data-close="rosterOverlay" aria-label="닫기">×</button></div><img src="assets/props/class-roster.jpg" alt="양금희 선생님과 3학년 4반 학생들의 출석부" /></div>
  </div>
  <audio id="bgm" src="assets/audio/bgm.mp3" preload="auto" loop></audio>
  <audio id="stairSound" src="assets/audio/stair-sfx.wav" preload="auto"></audio>
  <script src="game.js" defer></script>
</body>
</html>
